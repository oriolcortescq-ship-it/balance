<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Balance Personal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: ledger app shell. A section rail on the left, the working sheet on the right; the rail folds into a top bar under 880px. */
:root{
  --bg:#f2f3f0; --surface:#ffffff; --surface-2:#f4f5f2; --line:#dde0da; --line-2:#c8ccc5;
  --ink:#14191b; --ink-2:#4a5357; --muted:#7a8386;
  --accent:#2b45c4; --accent-ink:#ffffff; --accent-soft:#e7eafb; --accent-line:#b9c3f3;
  --pos:#0a7338; --pos-soft:#e2f2e7; --neg:#bf3a30; --neg-soft:#fbe8e6; --warn:#9a6200; --warn-soft:#fbf0d8;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --grid:#e6e8e3; --axis:#c3c7c0; --bar:#2b45c4; --bar-track:#eceee9;
  --shadow:0 1px 2px rgba(16,24,28,.05),0 10px 30px rgba(16,24,28,.08);
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-head:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px; --r-sm:7px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1213; --surface:#171b1d; --surface-2:#1d2225; --line:#2a3033; --line-2:#3a4145;
    --ink:#e8ecea; --ink-2:#b2babd; --muted:#808a8d;
    --accent:#8f9dff; --accent-ink:#0f1213; --accent-soft:#232a4a; --accent-line:#3d4a8a;
    --pos:#3cc46a; --pos-soft:#15301f; --neg:#f07167; --neg-soft:#3a1c1a; --warn:#e2a93b; --warn-soft:#352812;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --grid:#24292c; --axis:#3a4145; --bar:#8f9dff; --bar-track:#22282b;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1213; --surface:#171b1d; --surface-2:#1d2225; --line:#2a3033; --line-2:#3a4145;
  --ink:#e8ecea; --ink-2:#b2babd; --muted:#808a8d;
  --accent:#8f9dff; --accent-ink:#0f1213; --accent-soft:#232a4a; --accent-line:#3d4a8a;
  --pos:#3cc46a; --pos-soft:#15301f; --neg:#f07167; --neg-soft:#3a1c1a; --warn:#e2a93b; --warn-soft:#352812;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --grid:#24292c; --axis:#3a4145; --bar:#8f9dff; --bar-track:#22282b;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.mono{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* Shell */
.app{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;padding-block:16px 40px;max-width:1360px;margin:0 auto}
.side{position:sticky;top:16px;align-self:start;display:flex;flex-direction:column;gap:22px;min-height:calc(100vh - 32px)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px}
.mark{width:30px;height:30px;border-radius:8px;background:var(--ink);position:relative;flex:none;overflow:hidden}
.mark::before{content:"";position:absolute;left:6px;right:6px;top:8px;height:2px;background:var(--surface);box-shadow:0 5px 0 var(--surface),0 10px 0 var(--accent)}
.brand-name{font-family:var(--f-head);font-weight:600;font-size:17px;letter-spacing:.01em}
.brand-sub{font-size:11px;color:var(--muted);letter-spacing:.04em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-sm);color:var(--ink-2);text-decoration:none;font-weight:500}
.nav a svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav a:hover{background:var(--surface);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:inset 2px 0 0 var(--accent)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 6px}
.sync{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync[data-s="ok"] i{background:var(--pos)}
.sync[data-s="saving"] i{background:var(--warn)}
.sync[data-s="local"] i{background:var(--neg)}
.acct{display:flex;flex-direction:column;align-items:flex-start;gap:4px;font-size:12px;color:var(--ink-2);overflow-wrap:anywhere}
.acct .btn{padding:0 6px;margin-left:-6px}
.side-note{font-size:11.5px;color:var(--muted);line-height:1.4}

.main{min-width:0;display:flex;flex-direction:column;gap:18px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 20px;padding-top:6px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-head);font-weight:600;font-size:30px;line-height:1.1;margin:2px 0 0;letter-spacing:-.005em;text-wrap:balance}
h2{font-family:var(--f-head);font-weight:600;font-size:17px;margin:0;letter-spacing:.005em}
h3{font-family:var(--f-head);font-weight:600;font-size:15px;margin:0}
.top-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.08);border-color:var(--accent)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn-ghost:hover{background:var(--surface-2);border-color:transparent;color:var(--ink)}
.btn-danger{background:var(--neg);border-color:var(--neg);color:var(--bg)}
.btn-danger-ghost{background:transparent;border-color:transparent;color:var(--neg)}
.btn-danger-ghost:hover{background:var(--neg-soft);border-color:transparent}
.btn-sm{height:30px;padding:0 10px;font-size:13px}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:var(--r-sm);border:1px solid transparent;background:transparent;color:var(--ink-2);cursor:pointer;font-size:18px;line-height:1}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:2px;gap:2px}
.seg button,.seg label{position:relative;border:0;background:transparent;padding:0 12px;height:30px;border-radius:5px;cursor:pointer;color:var(--ink-2);font-weight:500;display:inline-flex;align-items:center}
.seg button[aria-pressed="true"],.seg label:has(input:checked){background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:focus-visible){outline:2px solid var(--accent)}
.period{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stepper{display:inline-flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);height:36px;padding:0 2px}
.stepper .plabel{min-width:128px;text-align:center;font-weight:500;padding:0 4px}
.stepper .icon-btn{width:30px;height:30px}
.stepper .icon-btn:disabled{opacity:.3;cursor:default}

input[type=text],input[type=search],input[type=date],input:not([type]),input[type=number],select,textarea{height:36px;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);padding:0 10px;min-width:0;width:100%}
textarea{height:auto;padding:8px 10px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-line);outline-offset:0;border-color:var(--accent)}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:12px;color:var(--ink-2);font-weight:500}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:520px){.row2,.row3{grid-template-columns:1fr}}

/* Surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.panel-h .sub{font-size:12.5px;color:var(--muted)}
.grid{display:grid;gap:18px}
.g-2{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.g-2e{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:1060px){.g-2,.g-2e{grid-template-columns:minmax(0,1fr)}}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{padding:16px 18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi-l{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-family:var(--f-mono)}
.kpi-v{font-family:var(--f-head);font-weight:600;font-size:25px;line-height:1.15;letter-spacing:-.01em;overflow-wrap:anywhere}
.kpi-d{font-size:12.5px;color:var(--ink-2)}
.up-good,.down-good{color:var(--pos)} .up-bad,.down-bad{color:var(--neg)}
.pos{color:var(--pos)} .neg{color:var(--neg)} .muted{color:var(--muted)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--pos-soft);color:var(--pos)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--neg-soft);color:var(--neg)}
.pill.info{background:var(--surface-2);color:var(--ink-2)}
.tag{display:inline-block;font-size:11px;font-family:var(--f-mono);padding:1px 6px;border-radius:4px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.tag.demo{background:var(--warn-soft);color:var(--warn);border-color:transparent}

/* Tables */
.tblwrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
table.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover td{background:var(--surface-2)}
.tbl tfoot td{border-top:1px solid var(--line-2);border-bottom:0;font-weight:600}
.tbl td.asset-cell{min-width:150px}
.tbl .concept{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl .sm{font-size:12px;color:var(--muted)}
.tbl input.cell{height:30px;width:110px;text-align:right}
.date-cell{white-space:nowrap;color:var(--ink-2)}

/* Bars */
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline}
.bar-row .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .vl{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.bar-row .vl small{color:var(--muted);margin-left:6px}
.track{grid-column:1/-1;position:relative;height:8px;border-radius:4px;background:var(--bar-track)}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--bar)}
.track .fill.over{background:var(--neg)}
.track .fill.near{background:var(--warn)}
.track .bmark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:1px}
.bar-row .meta{grid-column:1/-1;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}

.alloc{display:flex;gap:2px;height:14px;border-radius:5px;overflow:hidden;margin:4px 0 16px}
.alloc span{display:block;height:100%;min-width:2px}
.legend{display:flex;flex-direction:column;gap:8px}
.legend .li{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto;gap:10px;align-items:center;font-variant-numeric:tabular-nums}
.legend .sw{width:12px;height:12px;border-radius:3px}
.legend .p{color:var(--muted);min-width:52px;text-align:right}

/* Chart */
.chart{position:relative;width:100%;min-height:250px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .zero{stroke:var(--axis);stroke-width:1}
.chart .b-inc{fill:var(--s1)} .chart .b-exp{fill:var(--s2)}
.chart .nline{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.chart .ndot{fill:var(--ink);stroke:var(--surface);stroke-width:2}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover,.chart .hit.on{fill:var(--ink);fill-opacity:.05}
.chart .sel{fill:var(--accent);fill-opacity:.07}
.chart-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.chart-legend span{display:inline-flex;align-items:center;gap:6px}
.chart-legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.chart-legend i.ln{height:2px;width:14px;border-radius:1px;background:var(--ink)}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line-2);box-shadow:var(--shadow);border-radius:8px;padding:10px 12px;font-size:12.5px;min-width:180px;font-variant-numeric:tabular-nums}
.tip .t{font-weight:600;margin-bottom:6px;text-transform:capitalize}
.tip .r{display:flex;justify-content:space-between;gap:16px}
.tip .r i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.tip .f{margin-top:6px;color:var(--muted);font-size:11.5px}

/* Insights */
.ins{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
.ins li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.ins li:last-child{border-bottom:0}
.ins .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
.ins .ic.pos{background:var(--pos-soft);color:var(--pos)} .ins .ic.neg{background:var(--neg-soft);color:var(--neg)}
.ins .ic.warn{background:var(--warn-soft);color:var(--warn)} .ins .ic.info{background:var(--surface-2);color:var(--ink-2)}
.ai-box{margin-top:14px;border-top:1px dashed var(--line-2);padding-top:14px}
.ai-out{font-size:13.5px;line-height:1.55;max-width:70ch}
.ai-out h4{font-family:var(--f-head);font-size:14.5px;margin:12px 0 4px}
.ai-out p{margin:6px 0}
.ai-out ul{margin:4px 0;padding-left:20px}
.ai-out li{margin:3px 0}
.ai-note{font-size:12px;color:var(--muted);margin-top:8px}
.thinking{color:var(--muted);display:flex;align-items:center;gap:8px}
.thinking::before{content:"";width:10px;height:10px;border-radius:50%;border:2px solid var(--accent);border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar .search{flex:1 1 220px;max-width:340px}
.toolbar select{width:auto;max-width:200px}
.toolbar .sp{flex:1}
.summary-line{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--ink-2);margin:12px 0 4px;font-variant-numeric:tabular-nums}
.summary-line b{color:var(--ink);font-weight:600}

/* Empty / banner */
.empty{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;align-items:center;padding:28px}
.empty h2{font-size:24px;margin-bottom:8px}
.empty p{color:var(--ink-2);max-width:56ch;margin:0 0 16px}
.empty .acts{display:flex;flex-wrap:wrap;gap:10px}
.ledger-art{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;font-family:var(--f-mono);font-size:12px;color:var(--ink-2);background:var(--surface-2)}
.ledger-art div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line-2)}
.ledger-art div:last-child{border-bottom:0;font-weight:500;color:var(--ink)}
@media (max-width:760px){.empty{grid-template-columns:1fr;padding:20px}}
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--ink);border:1px solid transparent;font-size:13.5px}
.banner b{color:var(--warn)}
.loading{padding:40px 20px;text-align:center;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted)}

/* Settings */
.set-sec{display:flex;flex-direction:column;gap:12px}
.set-list{display:flex;flex-direction:column;gap:6px}
.set-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.set-add{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.data-acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.data-act{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2)}
.data-act p{margin:0;font-size:12.5px;color:var(--ink-2)}
.data-act.danger{border-color:var(--neg-soft)}

/* Modal */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,14,16,.45);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding:max(40px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);width:100%;max-width:540px;padding:20px}
.modal.wide{max-width:760px}
.mform{display:flex;flex-direction:column;gap:14px}
.m-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.m-head h2{font-size:20px}
.m-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:4px}
.m-actions .sp{flex:1}
.ferr{color:var(--neg);font-size:13px;margin:0}
.preview-line{font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:var(--r-sm);padding:9px 12px;font-variant-numeric:tabular-nums}

<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pad=n=>String(n).padStart(2,'0');
const isoDate=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>isoDate(new Date());
const MONTHS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MON_S=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const daysIn=(y,m)=>new Date(y,m,0).getDate();
const clone=o=>JSON.parse(JSON.stringify(o));
const CLASSES=['Acciones','ETF','Fondos','Renta fija','Cripto','Inmobiliario','Liquidez','Otros'];
const CURRENCIES=[['EUR','Euro'],['USD','Dólar estadounidense'],['GBP','Libra esterlina'],['CHF','Franco suizo'],['MXN','Peso mexicano'],['COP','Peso colombiano'],['ARS','Peso argentino'],['CLP','Peso chileno'],['PEN','Sol peruano']];
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const slug=s=>norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'cat';
function fmtDate(d){ if(!d) return ''; const [y,m,dd]=d.split('-'); return `${+dd} ${MON_S[+m-1]} ${y}`; }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/864e5); }

const DEFAULT_SETTINGS={
  currency:'EUR',
  expenseCats:[['vivienda','Vivienda'],['alimentacion','Alimentación'],['suministros','Suministros'],['transporte','Transporte'],['restaurantes','Restaurantes'],['ocio','Ocio'],['salud','Salud y deporte'],['suscripciones','Suscripciones'],['ropa','Ropa'],['viajes','Viajes'],['educacion','Educación'],['otros','Otros gastos']].map(([id,name])=>({id,name,budget:0})),
  incomeCats:[['nomina','Nómina'],['freelance','Trabajos extra'],['rendimientos','Intereses'],['otros-ingresos','Otros ingresos']].map(([id,name])=>({id,name})),
  accounts:['Cuenta corriente','Tarjeta de crédito','Efectivo'],
  demoBudgets:false
};
function normSettings(d){
  const s=clone(DEFAULT_SETTINGS);
  if(!d) return s;
  if(typeof d.currency==='string') s.currency=d.currency;
  if(Array.isArray(d.expenseCats)) s.expenseCats=d.expenseCats.filter(c=>c&&c.id).map(c=>({id:String(c.id),name:String(c.name||c.id),budget:+c.budget||0}));
  if(Array.isArray(d.incomeCats)) s.incomeCats=d.incomeCats.filter(c=>c&&c.id).map(c=>({id:String(c.id),name:String(c.name||c.id)}));
  if(Array.isArray(d.accounts)) s.accounts=d.accounts.map(String);
  s.demoBudgets=!!d.demoBudgets;
  return s;
}

/* ---------- state ---------- */
const now=new Date();
const S={
  settings:clone(DEFAULT_SETTINGS), tx:new Map(), assets:new Map(),
  view:'resumen', period:{mode:'month',y:now.getFullYear(),m:now.getMonth()+1},
  f:{q:'',type:'all',cat:'all',acct:'all'}, limit:150,
  mode:'connecting', saving:0, busy:null,
  ai:{status:'idle',text:'',err:'',ctl:null},
  macro:new Map(), macroReady:false, macroDate:null, mf:{region:'all',high:false}
};
let db=null, base=null, sampleFn=null, downloadsNs=null;

/* ---------- formatting ---------- */
const fmtCache=new Map();
function nf(key,opts){ let f=fmtCache.get(key); if(!f){ f=new Intl.NumberFormat('es-ES',opts); fmtCache.set(key,f);} return f; }
function money(v,o={}){
  const c=S.settings.currency||'EUR';
  const dec=o.dec===0?0:2;
  if(o.compact) return nf(c+'|c',{style:'currency',currency:c,notation:'compact',maximumFractionDigits:1}).format(v||0);
  return nf(c+'|'+dec+'|'+(o.sign?1:0),{style:'currency',currency:c,minimumFractionDigits:dec,maximumFractionDigits:dec,signDisplay:o.sign?'exceptZero':'auto'}).format(v||0);
}
function pct(v,dec=1,sign=false){ return nf('p'+dec+(sign?1:0),{style:'percent',minimumFractionDigits:dec,maximumFractionDigits:dec,signDisplay:sign?'exceptZero':'auto'}).format(isFinite(v)?v:0); }
function qty(v){ return nf('q',{maximumFractionDigits:6}).format(v||0); }
function parseAmount(s){
  if(typeof s==='number') return s;
  let t=String(s||'').replace(/[^\d,.\-]/g,'');
  if(!t) return NaN;
  const lc=t.lastIndexOf(','), ld=t.lastIndexOf('.');
  if(lc>-1&&ld>-1){ if(lc>ld) t=t.replace(/\./g,'').replace(',','.'); else t=t.replace(/,/g,''); }
  else if(lc>-1){ t=t.replace(/,/g,(m,i)=>i===lc?'.':''); }
  else if(ld>-1 && /^-?\d{1,3}(\.\d{3})+$/.test(t)){ t=t.replace(/\./g,''); }
  return parseFloat(t);
}
function amtInput(v){ return (v===''||v==null||isNaN(v))?'':String(v).replace('.',','); }

/* ---------- periods & aggregates ---------- */
function range(p){
  if(p.mode==='all') return ['0000-01-01','9999-12-31'];
  if(p.mode==='year') return [`${p.y}-01-01`,`${p.y}-12-31`];
  return [`${p.y}-${pad(p.m)}-01`,`${p.y}-${pad(p.m)}-${pad(daysIn(p.y,p.m))}`];
}
function shift(p,d){
  if(p.mode==='year') return {...p,y:p.y+d};
  if(p.mode==='month'){ let m=p.m+d,y=p.y; while(m<1){m+=12;y--} while(m>12){m-=12;y++} return {...p,y,m}; }
  return p;
}
function plabel(p){ return p.mode==='all'?'Todo el historial':p.mode==='year'?`Año ${p.y}`:`${MONTHS[p.m-1]} ${p.y}`; }
function prevShort(p){ if(p.mode==='year') return String(p.y-1); const q=shift(p,-1); return `${MON_S[q.m-1]}`; }
const inR=(d,r)=>d>=r[0]&&d<=r[1];
const txAll=()=>[...S.tx.values()];
const txIn=r=>txAll().filter(t=>inR(t.date,r));
function sums(list){ let inc=0,exp=0; for(const t of list){ if(t.type==='income') inc+=t.amount; else exp+=t.amount; } return {inc,exp,net:inc-exp,rate:inc>0?(inc-exp)/inc:null}; }
function cats(type){ return type==='income'?S.settings.incomeCats:S.settings.expenseCats; }
function catName(id,type){ const c=cats(type).find(c=>c.id===id); return c?c.name:'Sin categoría'; }
function byCat(list,type){ const m=new Map(); for(const t of list) if(t.type===type) m.set(t.category,(m.get(t.category)||0)+t.amount); return [...m].map(([id,v])=>({id,name:catName(id,type),v})).sort((a,b)=>b.v-a.v); }
function monthsBack(y,m,n){ const out=[]; for(let i=n-1;i>=0;i--){ let mm=m-i,yy=y; while(mm<1){mm+=12;yy--} out.push({y:yy,m:mm,key:`${yy}-${pad(mm)}`}); } return out; }
function monthly(y,m,n){
  const ms=monthsBack(y,m,n), idx=new Map(ms.map((x,i)=>[x.key,i]));
  const rows=ms.map(x=>({...x,inc:0,exp:0}));
  for(const t of S.tx.values()){ const i=idx.get(t.date.slice(0,7)); if(i==null) continue; if(t.type==='income') rows[i].inc+=t.amount; else rows[i].exp+=t.amount; }
  rows.forEach(r=>r.net=r.inc-r.exp); return rows;
}
function chartEnd(){
  const p=S.period;
  if(p.mode==='month') return [p.y,p.m];
  if(p.mode==='year') return (p.y===now.getFullYear())?[p.y,now.getMonth()+1]:[p.y,12];
  let last=today(); return [+last.slice(0,4),+last.slice(5,7)];
}
/* average spend per category over the n months before month p */
function catAverages(p,n){
  const ms=monthsBack(...(()=>{const q=shift({mode:'month',y:p.y,m:p.m},-1);return [q.y,q.m];})(),n);
  const keys=new Set(ms.map(x=>x.key)); const acc=new Map();
  for(const t of S.tx.values()) if(t.type==='expense'&&keys.has(t.date.slice(0,7))) acc.set(t.category,(acc.get(t.category)||0)+t.amount);
  const months=ms.filter(x=>txAll().some(t=>t.date.startsWith(x.key))).length||0;
  const out=new Map(); if(!months) return out;
  for(const [k,v] of acc) out.set(k,v/months); return out;
}

/* ---------- portfolio ---------- */
function position(a){
  const ops=[...(a.ops||[])].sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:0);
  let q=0,cost=0,realized=0,div=0,invested=0;
  for(const o of ops){
    const f=+o.fees||0;
    if(o.kind==='buy'){ q+=+o.qty; cost+=o.qty*o.price+f; invested+=o.qty*o.price+f; }
    else if(o.kind==='sell'){ const s=Math.min(+o.qty,q); const avg=q>0?cost/q:0; realized+=s*o.price-f-avg*s; cost-=avg*s; q-=s; if(q<1e-9){q=0;cost=0;} }
    else if(o.kind==='div'){ div+=(+o.amount||0)-f; }
  }
  const price=+a.price||0, value=q*price, unreal=value-cost, total=unreal+realized+div;
  return {qty:q,cost,avg:q>0?cost/q:0,value,unreal,unrealPct:cost>0?unreal/cost:0,realized,div,invested,total,totalPct:invested>0?total/invested:0};
}
function portfolio(){
  const rows=[...S.assets.values()].map(a=>({a,p:position(a)}));
  const t={value:0,cost:0,unreal:0,realized:0,div:0,invested:0,total:0};
  for(const {p} of rows) for(const k in t) t[k]+=p[k];
  t.unrealPct=t.cost>0?t.unreal/t.cost:0; t.totalPct=t.invested>0?t.total/t.invested:0;
  const cls=CLASSES.map((c,i)=>({c,i,v:rows.filter(r=>(CLASSES.includes(r.a.cls)?r.a.cls:'Otros')===c).reduce((s,r)=>s+r.p.value,0)})).filter(x=>x.v>0);
  return {rows,t,cls};
}
function invFlows(r){
  let buy=0,sell=0,div=0;
  for(const a of S.assets.values()) for(const o of a.ops||[]){ if(!inR(o.date,r)) continue; const f=+o.fees||0;
    if(o.kind==='buy') buy+=o.qty*o.price+f; else if(o.kind==='sell') sell+=o.qty*o.price-f; else div+=(+o.amount||0)-f; }
  return {buy,sell,div,net:buy-sell};
}

/* ---------- persistence ---------- */
const chains=new Map();
async function withRetry(fn){
  for(let i=0;;i++){
    try{ return await fn(); }
    catch(e){ const c=e&&e.code; if((c==='resource_exhausted'||c==='resource-exhausted'||c==='unavailable')&&i<5){ await sleep(500*2**i+Math.random()*400); continue; } throw e; }
  }
}
function serial(key,fn){ const prev=chains.get(key)||Promise.resolve(); const next=prev.catch(()=>{}).then(()=>withRetry(fn)); chains.set(key,next); return next; }
function errMsg(e){
  const c=e&&e.code;
  if(c==='permission-denied') return 'Tu cuenta no tiene permiso para guardar. Revisa las reglas de Firestore.';
  if(c==='quota_exceeded') return 'Se ha llenado el espacio de almacenamiento. Borra movimientos antiguos o datos de ejemplo para seguir guardando.';
  if(c==='invalid_argument') return 'No tienes permiso para guardar en esta página o el dato no es válido.';
  if(c==='revoked') return 'Se ha perdido el acceso al almacenamiento. Recarga la página.';
  return 'No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.';
}
function track(p){ S.saving++; updateSync(); return p.catch(e=>{ toast(errMsg(e),'error'); throw e; }).finally(()=>{ S.saving--; updateSync(); }); }
const txRef=id=>db.doc(base+'/ledger').collection('tx').doc(id);
const assetRef=id=>db.doc(base+'/ledger').collection('assets').doc(id);
const settingsRef=()=>db.doc(base+'/settings');
function stripId(o){ const {id,...rest}=o; return clone(rest); }
const Store={
  setTx(t){ S.tx.set(t.id,t); render(); if(!db) return saveLocal(); return track(serial('tx/'+t.id,()=>txRef(t.id).set(stripId(t)))).catch(()=>{}); },
  delTx(id){ S.tx.delete(id); render(); if(!db) return saveLocal(); return track(serial('tx/'+id,()=>txRef(id).delete())).catch(()=>{}); },
  setAsset(a){ S.assets.set(a.id,a); render(); if(!db) return saveLocal(); return track(serial('as/'+a.id,()=>assetRef(a.id).set(stripId(a)))).catch(()=>{}); },
  delAsset(id){ S.assets.delete(id); render(); if(!db) return saveLocal(); return track(serial('as/'+id,()=>assetRef(id).delete())).catch(()=>{}); },
  setSettings(s){ S.settings=s; fmtCache.clear(); render(); if(!db) return saveLocal(); return track(serial('settings',()=>settingsRef().set(clone(s)))).catch(()=>{}); },
  async bulk(ops,label){
    // ops: [{kind:'setTx'|'delTx'|'setAsset'|'delAsset', v}]
    for(const o of ops){
      if(o.kind==='setTx') S.tx.set(o.v.id,o.v); else if(o.kind==='delTx') S.tx.delete(o.v);
      else if(o.kind==='setAsset') S.assets.set(o.v.id,o.v); else if(o.kind==='delAsset') S.assets.delete(o.v);
    }
    render();
    if(!db){ await saveLocal(); return true; }
    if(!ops.length) return true;
    S.busy={label,done:0,total:ops.length}; updateSync();
    let i=0, failed=null;
    const worker=async()=>{ while(i<ops.length&&!failed){ const o=ops[i++];
      const fn=o.kind==='setTx'?()=>txRef(o.v.id).set(stripId(o.v)):o.kind==='delTx'?()=>txRef(o.v).delete():o.kind==='setAsset'?()=>assetRef(o.v.id).set(stripId(o.v)):()=>assetRef(o.v).delete();
      const key=(o.kind.endsWith('Tx')?'tx/':'as/')+(typeof o.v==='string'?o.v:o.v.id);
      try{ await serial(key,fn); }catch(e){ failed=e; }
      S.busy.done++; updateSync(); } };
    await Promise.all([worker(),worker(),worker(),worker()]);
    S.busy=null; updateSync();
    if(failed){ toast(errMsg(failed),'error'); return false; }
    return true;
  }
};

/* ---------- sync indicator / banner / toasts ---------- */
function updateSync(){
  const el=$('#sync'); if(!el) return;
  let s='wait',t='Conectando…';
  if(S.mode==='memory'){ s='local'; t='Sin guardado (modo prueba)'; }
  else if(S.mode==='local'){ s='ok'; t='Guardado en este navegador'; }
  else if(S.mode==='login'){ s='wait'; t='Sin sesión iniciada'; }
  else if(S.mode==='db'){ if(S.busy){ s='saving'; t=`${S.busy.label}: ${S.busy.done}/${S.busy.total}`; } else if(S.saving>0){ s='saving'; t='Guardando…'; } else { s='ok'; t=S.cloud?'Guardado en tu nube':'Guardado'; } }
  el.dataset.s=s; el.querySelector('span').textContent=t;
  $('#brand-sub').textContent=`${S.settings.currency} · libro privado`;
  const ac=$('#acct'); if(ac){ const u=S.cloud&&S.cloud.user; ac.hidden=!u; if(u) ac.querySelector('span').textContent=u.email||'Cuenta de Google'; }
  const sn=$('#side-note'); if(sn&&S.cloud) sn.textContent='Tus datos se guardan en tu base de datos de Firebase. Solo tu cuenta de Google puede abrirlos.'; else if(sn&&S.mode==='local') sn.textContent='Tus datos se guardan solo en este navegador. Exporta una copia de vez en cuando desde Ajustes.';
}

function deltaHtml(cur,prev,upIsGood){

function insights(){
  const p=S.period, r=range(p), pr=range(shift(p,-1));
  const cur=sums(txIn(r)), prev=sums(txIn(pr)); const out=[];
  if(cur.inc>0){
    const tone=cur.rate>=0.2?'pos':cur.rate>=0?'info':'neg';
    out.push({tone,text:`Tasa de ahorro del <b>${pct(cur.rate)}</b>${p.mode!=='all'&&prev.inc>0?` (antes: ${pct(prev.rate)})`:''}. ${cur.rate>=0.2?'Supera el 20 % que suele usarse como referencia.':cur.rate>=0?'Está por debajo del 20 % que suele usarse como referencia.':'Has gastado más de lo que has ingresado.'}`});
  }
  if(p.mode!=='all'&&prev.exp>0&&cur.exp>0){ const ch=(cur.exp-prev.exp)/prev.exp;
    out.push({tone:ch>0.05?'warn':ch<-0.05?'pos':'info',text:`Gastos ${ch>=0?'▲':'▼'} <b>${pct(Math.abs(ch))}</b> respecto a ${esc(p.mode==='year'?String(p.y-1):plabel(shift(p,-1)))} (${money(prev.exp)}).`}); }
  const cs=byCat(txIn(r),'expense');
  if(cs.length&&cur.exp>0) out.push({tone:'info',text:`<b>${esc(cs[0].name)}</b> es tu mayor partida: ${money(cs[0].v)}, el ${pct(cs[0].v/cur.exp,0)} del gasto.`});
  if(p.mode==='month'){
    const av=catAverages(p,6); let best=null;
    for(const c of cs){ const a=av.get(c.id)||0; if(a>20&&c.v>a*1.3){ const d=c.v-a; if(!best||d>best.d) best={c,a,d}; } }
    if(best) out.push({tone:'warn',text:`En <b>${esc(best.c.name)}</b> llevas ${money(best.c.v)}, ${money(best.d,{dec:0})} más que tu media de los meses anteriores.`});
    const over=S.settings.expenseCats.filter(c=>c.budget>0&&((cs.find(x=>x.id===c.id)||{}).v||0)>c.budget);
    if(over.length) out.push({tone:'neg',text:`Presupuesto superado en ${over.map(c=>`<b>${esc(c.name)}</b>`).join(', ')}.`});
    const t=today();
    if(inR(t,r)){ const day=+t.slice(8); const prevMs=monthsBack(...(()=>{const q=shift(p,-1);return [q.y,q.m]})(),3);
      const vals=prevMs.map(x=>txAll().filter(tx=>tx.type==='expense'&&tx.date.startsWith(x.key)&&+tx.date.slice(8)<=day).reduce((s,tx)=>s+tx.amount,0)).filter((v,i)=>txAll().some(tx=>tx.date.startsWith(prevMs[i].key)));
      if(vals.length){ const avg=vals.reduce((a,b)=>a+b,0)/vals.length; if(avg>0){ const d=(cur.exp-avg)/avg;
        out.push({tone:d>0.1?'warn':'info',text:`A día ${day} llevas ${money(cur.exp,{dec:0})} gastados; en los últimos meses a estas alturas llevabas de media ${money(avg,{dec:0})}.`}); } }
    }
  }
  const pf=portfolio();
  if(pf.t.value>0){
    const top=pf.rows.filter(x=>x.p.value>0).sort((a,b)=>b.p.value-a.p.value)[0]; const w=top.p.value/pf.t.value;
    if(w>0.4&&pf.rows.filter(x=>x.p.value>0).length>1) out.push({tone:'warn',text:`<b>${esc(top.a.name)}</b> concentra el ${pct(w,0)} de tu cartera.`});
    const stale=pf.rows.filter(x=>x.p.qty>0&&(!x.a.priceDate||daysBetween(x.a.priceDate,today())>30));
    if(stale.length) out.push({tone:'warn',text:`${stale.length===1?'Un activo tiene':stale.length+' activos tienen'} el precio sin actualizar desde hace más de 30 días. <a href="#inversiones">Actualizar precios</a>`});
  }
  return out;
}
function md(src){
  const lines=esc(src).split('\n'); let html='', inList=false;
  const inline=s=>s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*(?!\s)(.+?)\*/g,'$1<em>$2</em>');
  for(let ln of lines){
    const l=ln.trim();
    if(/^[-*•]\s+/.test(l)||/^\d+[.)]\s+/.test(l)){ if(!inList){ html+='<ul>'; inList=true; } html+=`<li>${inline(l.replace(/^([-*•]|\d+[.)])\s+/,''))}</li>`; continue; }
    if(inList){ html+='</ul>'; inList=false; }
    if(!l) continue;
    const h=l.match(/^#{1,4}\s+(.*)$/); if(h){ html+=`<h4>${inline(h[1])}</h4>`; continue; }
    html+=`<p>${inline(l)}</p>`;
  }
  if(inList) html+='</ul>'; return html;
}

/* ---------- flow chart (SVG) ---------- */
function niceStep(x){ const e=Math.pow(10,Math.floor(Math.log10(x))); const f=x/e; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e; }
function barPath(x,y0,w,y1){ // y0 baseline, y1 top (y1<y0 for positive)
  const top=Math.min(y0,y1), bot=Math.max(y0,y1), h=bot-top; if(h<0.5) return '';
  const r=Math.min(3,w/2,h);
  if(y1<=y0) return `M${x},${bot}V${top+r}Q${x},${top} ${x+r},${top}H${x+w-r}Q${x+w},${top} ${x+w},${top+r}V${bot}Z`;
  return `M${x},${top}V${bot-r}Q${x},${bot} ${x+r},${bot}H${x+w-r}Q${x+w},${bot} ${x+w},${bot-r}V${top}Z`;
}
let flowRows=[];
function drawFlow(){
  const el=$('#flow'); if(!el) return;
  const [ey,em]=chartEnd(); const rows=flowRows=monthly(ey,em,12);
  const W=Math.max(300,el.clientWidth||700), H=W<520?220:260, m={t:14,r:6,b:26,l:W<520?46:58};
  const iw=W-m.l-m.r, ih=H-m.t-m.b;
  let hi=Math.max(1,...rows.map(r=>Math.max(r.inc,r.exp,r.net))), lo=Math.min(0,...rows.map(r=>r.net));
  const step=niceStep((hi-lo)/4); hi=Math.ceil(hi/step)*step; lo=Math.floor(lo/step)*step; if(hi===lo) hi=lo+step;
  const y=v=>m.t+ih-(v-lo)/(hi-lo)*ih;
  const bw=iw/rows.length, gap=2, barW=Math.max(3,Math.min(18,(bw-12)/2));
  let g='';
  for(let v=lo;v<=hi+1e-9;v+=step){ const yy=y(v).toFixed(1); g+=`<line class="${Math.abs(v)<1e-9?'zero':'gl'}" x1="${m.l}" x2="${W-m.r}" y1="${yy}" y2="${yy}"/><text x="${m.l-8}" y="${yy}" dy="3.5" text-anchor="end">${esc(money(v,{compact:true}))}</text>`; }
  const y0=y(0); let bars='', pts=[], hits='', labels='';
  const selKey=S.period.mode==='month'?`${S.period.y}-${pad(S.period.m)}`:null;
  rows.forEach((r,i)=>{
    const cx=m.l+bw*(i+.5);
    if(r.key===selKey) bars+=`<rect class="sel" x="${(m.l+bw*i+1).toFixed(1)}" y="${m.t}" width="${(bw-2).toFixed(1)}" height="${ih}" rx="4"/>`;
    bars+=`<path class="b-inc" d="${barPath(cx-barW-gap/2,y0,barW,y(r.inc))}"/><path class="b-exp" d="${barPath(cx+gap/2,y0,barW,y(r.exp))}"/>`;
    pts.push([cx,y(r.net)]);
    const showLbl=W>=560||i%2===(rows.length-1)%2;
    if(showLbl) labels+=`<text x="${cx.toFixed(1)}" y="${H-8}" text-anchor="middle">${MON_S[r.m-1]}${r.m===1||i===0?` ${String(r.y).slice(2)}`:''}</text>`;
    hits+=`<rect class="hit" data-i="${i}" x="${(m.l+bw*i).toFixed(1)}" y="${m.t}" width="${bw.toFixed(1)}" height="${ih}" rx="4"/>`;
  });
  const line=`<polyline class="nline" points="${pts.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ')}"/>`+pts.map(p=>`<circle class="ndot" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5"/>`).join('');
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Ingresos, gastos y ahorro neto de los últimos 12 meses">${g}${bars}${line}${labels}${hits}</svg>`;
}
function showTip(i,ev){

  tip.innerHTML=`<div class="t">${MONTHS[r.m-1]} ${r.y}</div>

    <div class="r"><span><i style="background:var(--s2)"></i>Gastos</span><b>${money(r.exp)}</b></div>

function fmtDateLong(d){ if(!d) return ''; const [y,m,dd]=d.split('-').map(Number); const w=WEEKDAYS[new Date(y,m-1,dd).getDay()]; return `${w} ${dd} ${MON_S[m-1]}`; }
function macroDay(){ return S.macroDate||today(); }
function shiftDay(d,n){ const [y,m,dd]=d.split('-').map(Number); return isoDate(new Date(y,m-1,dd+n)); }
function firstNum(v){ const m=String(v==null?'':v).match(/-?\d+(?:[.,]\d+)?/); return m?parseFloat(m[0].replace(',','.')):NaN; }

}
function impHtml(n){ n=Math.max(1,Math.min(3,+n||1)); const l=['baja','media','alta'][n-1]; return `<span class="imp ${n===3?'hi':''}" role="img" aria-label="Importancia ${l}" title="Importancia ${l}">${[1,2,3].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</span>`; }
function sortEv(a,b){ return String(a.time||'99').localeCompare(String(b.time||'99'))||(+b.importance||0)-(+a.importance||0); }
function fmtUpd(iso){ if(!iso) return ''; const d=new Date(iso); if(isNaN(d)) return ''; return `Actualizado el ${d.getDate()} ${MON_S[d.getMonth()]} a las ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function macroStatus(d){ const ev=(d.events||[]).filter(e=>e.forecast!=null&&e.forecast!==''||e.previous!=null&&e.previous!==''); const done=ev.filter(evActual).length;

function budgetTable(factor){

  </section>`:'';
  return `${head}<section class="panel">
    <div class="panel-h"><div><h2>Límites por categoría</h2><div class="sub">Escribe el límite mensual y pulsa Intro. La media es la de los 6 meses anteriores con datos.</div></div>

let lastFocus=null;

}
function closeModal(){ $('#overlay').hidden=true; $('#modal').innerHTML=''; if(lastFocus&&lastFocus.focus) try{lastFocus.focus();}catch(_){} }
function confirmModal({title,body,ok='Confirmar',danger=true,typed=null,onOk}){

}

  </form>`);
  const kind=()=>$('input[name=op-kind]:checked').value;
  const upd=()=>{ const k=kind(); $('#op-newfields').hidden=$('#op-asset').value!=='__new'; $('#op-qp').hidden=k==='div'; $('#op-amt-w').hidden=k!=='div'; $('#op-upd-w').hidden=k==='div';
    const q=parseAmount($('#op-qty').value), p=parseAmount($('#op-price').value), f=parseAmount($('#op-fees').value)||0, a=parseAmount($('#op-amount').value);

      if(k==='sell'&&$('#op-asset').value!=='__new'){ const pos=position(S.assets.get($('#op-asset').value)); if(pos.qty>0){ const g=q*p-f-pos.avg*Math.min(q,pos.qty); txt+=` · Plusvalía estimada <b class="${g<0?'neg':'pos'}">${money(g,{sign:true})}</b>`; if(q>pos.qty+1e-9) txt+=` · Solo tienes ${qty(pos.qty)}`; } } }

  $('#op-form').addEventListener('submit',e=>{ e.preventDefault(); const err=$('#op-err'); const fail=m=>{ err.textContent=m; err.hidden=false; };
    const k=kind(), date=$('#op-date').value, fees=parseAmount($('#op-fees').value)||0;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) return fail('Elige una fecha válida.');
    let a; const aid=$('#op-asset').value;

    a.ops=[...(a.ops||[]),op];
    Store.setAsset(a); closeModal(); toast('Operación guardada');
  });

/* ---------- CSV / JSON ---------- */
function parseCSV(text){
  text=text.replace(/^﻿/,''); const first=text.split(/\r?\n/)[0]||'';
  const d=[';','\t',','].map(c=>[c,first.split(c).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }

      s.expenseCats.forEach(c=>{ if(!c.budget&&av.get(c.id)){ c.budget=Math.ceil(av.get(c.id)/10)*10; n++; } }); s.demoBudgets=false;
      if(n){ Store.setSettings(s); toast(`${n} límites rellenados con tu media`);} else toast('No hay categorías vacías con historial'); break; }
    case 'del-cat': { const kind=el.dataset.kind, type=kind==='ce'?'expense':'income'; const s=clone(S.settings); const arr=type==='expense'?s.expenseCats:s.incomeCats;
      if(arr.length<=1) return toast('Debe quedar al menos una categoría.','error');
      const c=arr.find(c=>c.id===id); const n=txAll().filter(t=>t.type===type&&t.category===id).length;
      confirmModal({title:`Eliminar «${esc(c.name)}»`,ok:'Eliminar categoría',body:`<p style="margin:0">${n?`${n} movimientos de esta categoría pasarán a «Sin categoría». Puedes reasignarlos editándolos.`:'No hay movimientos en esta categoría.'}</p>`,
        onOk:()=>{ if(type==='expense') s.expenseCats=arr.filter(x=>x.id!==id); else s.incomeCats=arr.filter(x=>x.id!==id); Store.setSettings(s); }}); break; }
    case 'del-acc': { const s=clone(S.settings); s.accounts.splice(+el.dataset.i,1); Store.setSettings(s); break; }
  }
});

  if(t.id==='s-cur'){ const s=clone(S.settings); s.currency=t.value; Store.setSettings(s); return; }
  if(t.dataset.budget){ const v=t.value.trim()===''?0:parseAmount(t.value); if(!(v>=0)){ toast('Escribe un número válido, por ejemplo 250.','error'); t.value=''; return; }
    const s=clone(S.settings); const c=s.expenseCats.find(c=>c.id===t.dataset.budget); if(c&&c.budget!==v){ c.budget=Math.round(v*100)/100; s.demoBudgets=false; Store.setSettings(s); } return; }
  if(t.dataset.price){ const v=parseAmount(t.value); const a=S.assets.get(t.dataset.price); if(!a) return; if(!(v>=0)){ toast('Escribe un precio válido.','error'); t.value=amtInput(a.price); return; }
    if(v!==a.price){ const n=clone(a); n.price=v; n.priceDate=today(); Store.setAsset(n); toast('Precio actualizado'); } return; }
  if(t.dataset.rename){ const s=clone(S.settings); const arr=t.dataset.rename==='ce'?s.expenseCats:s.incomeCats; const c=arr.find(c=>c.id===t.dataset.id); const v=t.value.trim(); if(c&&v&&v!==c.name){ c.name=v; Store.setSettings(s); } else if(!v) t.value=c?c.name:''; return; }
  if(t.dataset.acc!=null&&t.dataset.acc!==''){ const s=clone(S.settings); const i=+t.dataset.acc, v=t.value.trim(); const old=s.accounts[i]; if(v&&v!==old){ s.accounts[i]=v; Store.setSettings(s); } else if(!v) t.value=old; return; }
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-add]'); if(!f) return; e.preventDefault();
  const kind=f.dataset.add, inp=f.querySelector('input'), v=inp.value.trim(); if(!v) return;
  const s=clone(S.settings);
  if(kind==='acc'){ if(s.accounts.includes(v)) return toast('Esa cuenta ya existe.','error'); s.accounts.push(v); }
  else { const arr=kind==='ce'?s.expenseCats:s.incomeCats; if(arr.some(c=>norm(c.name)===norm(v))) return toast('Esa categoría ya existe.','error'); let id=slug(v); while(arr.some(c=>c.id===id)) id+='-2'; arr.push(kind==='ce'?{id,name:v,budget:0}:{id,name:v}); }
  inp.value=''; Store.setSettings(s);
});

/* ---------- boot ---------- */
function setMemory(){ S.mode='memory'; doRender(); }
const LS_KEY='balance-personal-v1';
function setLocal(){
  let d=null; try{ d=JSON.parse(localStorage.getItem(LS_KEY)||'null'); }catch(_){ d=null; }
  try{ localStorage.setItem(LS_KEY+'-test','1'); localStorage.removeItem(LS_KEY+'-test'); }catch(_){ setMemory(); return; }
  if(d){ S.settings=normSettings(d.settings); S.tx=new Map((d.tx||[]).filter(t=>t&&t.id&&t.date).map(t=>[t.id,{...t,amount:+t.amount||0}])); S.assets=new Map((d.assets||[]).filter(a=>a&&a.id).map(a=>[a.id,{...a,ops:Array.isArray(a.ops)?a.ops:[]}])); }
  S.mode='local'; doRender();
}
function saveLocal(){
  if(S.mode!=='local') return Promise.resolve();
  try{ localStorage.setItem(LS_KEY,JSON.stringify({version:1,settings:S.settings,tx:txAll(),assets:[...S.assets.values()]})); }
  catch(e){ toast('No se pudo guardar en el navegador. Puede que esté lleno o bloqueado. Exporta una copia desde Ajustes.','error'); }
  return Promise.resolve();
}
window.addEventListener('storage',e=>{ if(e.key===LS_KEY&&S.mode==='local') setLocal(); });

};
const FB_KEY='balance-personal-firebase';
function lsGet(k){ try{ return localStorage.getItem(k); }catch(_){ return null; } }
function lsSet(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(_){} }
function parseFbConfig(text){
  const o={}; const re=/["']?(apiKey|authDomain|projectId|storageBucket|messagingSenderId|appId|measurementId)["']?\s*:\s*["']([^"']+)["']/g; let m;
  while((m=re.exec(String(text||'')))) o[m[1]]=m[2];
  return (o.apiKey&&o.authDomain&&o.projectId&&o.appId)?o:null;
}
function getFbConfig(){ if(FIREBASE_CONFIG&&FIREBASE_CONFIG.apiKey) return {cfg:FIREBASE_CONFIG,src:'file'}; const t=lsGet(FB_KEY); if(t){ try{ const c=JSON.parse(t); if(c&&c.apiKey) return {cfg:c,src:'browser'}; }catch(_){} } return null; }
function loadScript(src){ return new Promise((res,rej)=>{ const el=document.createElement('script'); el.src=src; el.onload=res; el.onerror=()=>rej(new Error('No se pudo cargar '+src)); document.head.append(el); }); }
let unsubs=[];
function unsubscribeAll(){ for(const u of unsubs){ try{u();}catch(_){} } unsubs=[]; }
async function startCloud(info){
  const B='https://www.gstatic.com/firebasejs/10.12.2/';
  await loadScript(B+'firebase-app-compat.js'); await loadScript(B+'firebase-auth-compat.js'); await loadScript(B+'firebase-firestore-compat.js');
  const fb=window.firebase; fb.initializeApp(info.cfg);
  const auth=fb.auth(), fs=fb.firestore();
  try{ await fs.enablePersistence({synchronizeTabs:true}); }catch(_){}
  S.cloud={auth,fs,user:null,src:info.src,projectId:info.cfg.projectId,err:''};
  S.mode='login'; doRender();
  auth.onAuthStateChanged(u=>{
    unsubscribeAll(); S.tx=new Map(); S.assets=new Map(); S.settings=clone(DEFAULT_SETTINGS);
    if(!u){ db=null; S.cloud.user=null; S.mode='login'; doRender(); return; }
    S.cloud.user=u; S.cloud.err=''; db=fs; base='users/'+u.uid+'/data'; S.mode='connecting'; doRender();
    subscribeUser(e=>{ if(e&&e.code==='permission-denied'){ S.cloud.err=`La cuenta ${u.email||''} no tiene permiso en esta base de datos. Revisa que las reglas de Firestore lleven tu correo.`; db=null; unsubscribeAll(); S.mode='login'; doRender(); } });
  });
}
async function cloudLogin(){
  if(!S.cloud) return; S.cloud.err=''; const prov=new window.firebase.auth.GoogleAuthProvider(); prov.setCustomParameters({prompt:'select_account'});
  try{ await S.cloud.auth.signInWithPopup(prov); }
  catch(e){ const c=e&&e.code;
    if(c==='auth/popup-blocked'||c==='auth/operation-not-supported-in-this-environment'){ try{ await S.cloud.auth.signInWithRedirect(prov); return; }catch(_){} }
    if(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request') return;
    S.cloud.err=c==='auth/unauthorized-domain'?`Este dominio (${location.hostname||'archivo local'}) no está autorizado. Añádelo en Firebase → Authentication → Configuración → Dominios autorizados.`:c==='auth/operation-not-allowed'?'El inicio de sesión con Google no está activado en Firebase → Authentication → Método de acceso.':'No se pudo iniciar sesión: '+(e&&e.message||c);
    doRender(); }
}
function subscribeUser(onFatal){
  const got={s:false,t:false,a:false};
  const ready=()=>{ if(got.s&&got.t&&got.a&&S.mode==='connecting'){ S.mode='db'; } render(); };
  const onErr=e=>{ if(onFatal) onFatal(e); if(e&&(e.code==='revoked'||e.code==='not_granted')){ db=null; S.mode='memory'; render(); toast('Se ha perdido el acceso al almacenamiento.','error'); } };
  try{
    unsubs.push(settingsRef().onSnapshot(s=>{ S.settings=s.exists?normSettings(clone(s.data())):S.settings; fmtCache.clear(); got.s=true; ready(); },onErr));
    unsubs.push(db.doc(base+'/ledger').collection('tx').onSnapshot(q=>{ const m=new Map(); for(const d of q.docs){ const v=clone(d.data()); v.id=d.id; v.amount=+v.amount||0; if(!v.date) continue; m.set(d.id,v); } S.tx=m; got.t=true; ready(); },onErr));
    unsubs.push(db.doc(base+'/ledger').collection('assets').onSnapshot(q=>{ const m=new Map(); for(const d of q.docs){ const v=clone(d.data()); v.id=d.id; v.ops=Array.isArray(v.ops)?v.ops:[]; m.set(d.id,v); } S.assets=m; got.a=true; ready(); },onErr));
  }catch(e){ db=null; setMemory(); }
}
function localData(){ try{ const d=JSON.parse(localStorage.getItem(LS_KEY)||'null'); if(d&&((d.tx||[]).length||(d.assets||[]).length)) return d; }catch(_){} return null; }
async function migrateLocal(){
  const d=localData(); if(!d||!db) return;
  const txs=(d.tx||[]).filter(t=>t&&t.id&&t.date).map(t=>({...t,amount:+t.amount||0}));
  const as=(d.assets||[]).filter(a=>a&&a.id).map(a=>({...a,ops:Array.isArray(a.ops)?a.ops:[]}));
  if(!S.tx.size&&!S.assets.size&&d.settings) await Store.setSettings(normSettings(d.settings));
  const ok=await Store.bulk([...txs.map(v=>({kind:'setTx',v})),...as.map(v=>({kind:'setAsset',v}))],'Subiendo');
  if(ok){ lsSet(LS_KEY+'-migrated','1'); toast(`${txs.length} movimientos y ${as.length} activos subidos a tu nube`); render(); }
}
async function boot(){
  route();
  const c=window.claude;
  if(!c||typeof c.use!=='function'){
    const info=getFbConfig();
    if(info){ try{ await startCloud(info); return; }catch(e){ S.cloudFail='No se pudo conectar con Firebase. Revisa tu conexión o la configuración en Ajustes.'; } }
    setLocal(); return;
  }
  const [dbNs,userNs,smp,dl]=await Promise.all(['db','user','sample','downloads'].map(n=>Promise.resolve().then(()=>c.use(n)).catch(()=>null)));
  sampleFn=smp||null; downloadsNs=dl||null;
  let uid=null; if(userNs){ try{ uid=await userNs.id(); }catch(_){ uid=null; } }
  if(dbNs){ S.macroAvail=true; try{ dbNs.collection('data/macro/days').onSnapshot(q=>{ const m=new Map(); for(const d of q.docs){ const v=clone(d.data()); if(v&&Array.isArray(v.events)) m.set(d.id,v); } S.macro=m; S.macroReady=true; render(); },()=>{ S.macroReady=true; render(); }); }catch(_){ } }
  if(!dbNs||!uid){ if(dbNs) db=null; setMemory(); return; }
  db=dbNs; base='data/users/'+uid;
  subscribeUser(null);
}
boot();
})();
